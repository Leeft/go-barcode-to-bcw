# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types:
      - published

permissions: {}

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: index.docker.io
      IMAGE_NAME: ${{ github.repository }}
      DOCKER_IMAGE: shiari/go-barcode-to-bcw
    strategy:
      matrix:
        os: [linux]
        
    steps:
    
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '^1.26.2'
        
    - name: Install dependencies
      run: |
        go get .

    - name: Install dependencies pt2 
      if: matrix.os == 'linux'
      run: |
        sudo apt install -y libusb-1.0-0 libusb-1.0-0-dev
        
    # - name: Run all tests recursively and verbosely
    #   run: TZ=UTC go test -v ./... 
    #   if: matrix.os == 'linux'

    - name: Build [linux]
      id: build_linux
      if: matrix.os == 'linux'
      run: |
        echo "TAG=$(git describe --tags)" >> "$GITHUB_OUTPUT"
        CGO_ENABLED=1 GOOS=$os GOARCH=amd64 go build -ldflags="-s -w -X 'main.version=$(git describe --tags 2>/dev/null || echo build)'" -trimpath -o   go-barcode-to-bcw main.go
        tar -I 'gzip -9' -cf   go-barcode-to-bcw-$os-amd64.tar.gz   go-barcode-to-bcw LICENSE
        rm go-barcode-to-bcw
        printf "sha256: %s\n" "$(shasum -a 256 go-barcode-to-bcw-$os-amd64.tar.gz)"
      env:
        os: ${{ matrix.os }}

    - name: Build [docker]
      if: matrix.os == 'linux'
      run: |
        CGO_ENABLED=1 GOOS=$os GOARCH=amd64 go build -a -installsuffix cgo -ldflags="-s -w -X 'main.version=$(git describe --tags 2>/dev/null || echo build)'" -trimpath -o   go-barcode-to-bcw main.go
        tar -I 'gzip -9' -cf go-barcode-to-bcw-docker-amd64.tar.gz go-barcode-to-bcw Dockerfile
        rm go-barcode-to-bcw
        printf "sha256: %s\n" "$(shasum -a 256 go-barcode-to-bcw-docker-amd64.tar.gz)"
      env:
        os: ${{ matrix.os }}

    - name: Upload Release Assets [linux]
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag' && matrix.os == 'linux'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        os: ${{ matrix.os }}
      with:
        files: go-barcode-to-bcw-${{ matrix.os }}-amd64.tar.gz        

    - name: Upload Release Assets [docker]
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag' && matrix.os == 'linux'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: go-barcode-to-bcw-docker-amd64.tar.gz        

    # Additional docker build steps for 'os=linux'

    - name: Log in to Docker Hub [docker]
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      if: github.ref_type == 'tag' && matrix.os == 'linux'
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      if: github.ref_type == 'tag' && matrix.os == 'linux'
      with:
        images: ${{ env.DOCKER_IMAGE }}

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v6
      if: github.ref_type == 'tag' && matrix.os == 'linux'
      with:
        context: https://github.com/${{ github.repository }}/releases/download/${{ steps.build_linux.outputs.TAG }}/  go-barcode-to-bcw-docker-amd64.tar.gz
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v3
      if: github.ref_type == 'tag' && matrix.os == 'linux'
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
